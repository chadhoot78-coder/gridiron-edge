<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Edge has moved</title>
<link rel="icon" type="image/png" href="icon.png">
<style>body{font-family:system-ui,sans-serif;background:#F5F4EE;color:#17263A;margin:0;padding:40px 20px;text-align:center} a{color:#17263A;font-weight:600} p{color:#5B6778;max-width:34em;margin:12px auto}</style>
<script>
/* Gridiron Edge now lives inside Saturday Edge (?league=nfl). localStorage doesn't cross domains, so this page packs the
   bets, grades, picks and lines saved here into the URL hash and the combined app merges them in on arrival. */
(function(){
  const keys = ["bets","betsDeleted","graded","picks","openers","lines","overrides","bank","k","lastSeen"], data = {};
  for(const k of keys){ try{ const v = localStorage.getItem("ge:" + k); if(v != null) data[k] = JSON.parse(v); }catch(_){} }
  let pack = JSON.stringify({prefix:"ge:", data});
  if(pack.length > 150000){ delete data.lines; delete data.openers; pack = JSON.stringify({prefix:"ge:", data}); }
  const hash = Object.keys(data).length ? "#import=" + btoa(unescape(encodeURIComponent(pack))) : "";
  const target = "https://saturday-edge.vercel.app/?league=nfl" + hash;
  document.addEventListener("DOMContentLoaded", () => { document.getElementById("go").href = target; });
  setTimeout(() => location.replace(target), 700);
})();
</script>
</head>
<body>
<h1>Gridiron Edge has moved</h1>
<p>The NFL picks now live inside Saturday Edge, with a College / NFL switch at the top. Your bets and picks from this site come along automatically.</p>
<p><a id="go" href="https://saturday-edge.vercel.app/?league=nfl">Open Gridiron Edge →</a></p>
<p style="font-size:13px">Add the new page to your Home Screen from there — this old icon will keep redirecting.</p>
</body>
</html>
